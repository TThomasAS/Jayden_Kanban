name: CI/CD

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jaydee-kanban-api

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
    env:
      MONGO_TEST_URI: mongodb://localhost:27017/visiplus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: docker build -t $IMAGE:${{ github.sha }} .

  publish-and-deploy:
    needs: ci
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # "production" est protégé par une approbation manuelle dans les paramètres GitHub
    environment: ${{ github.event_name == 'release' && 'production' || 'recette' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        run: |
          TAG=${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          docker build -t $IMAGE:$TAG -t $IMAGE:${{ github.sha }} .
          docker push --all-tags $IMAGE
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/jaydee-kanban
            docker compose pull api
            docker compose up -d
            sleep 10 && curl -fsS http://localhost:3000/health
